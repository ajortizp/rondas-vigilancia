
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recuperación de rondas V3</title>

<style>
* {
  box-sizing: border-box;
}
body {
  font-family: Arial, sans-serif;
  background: #f4f5f7;
  padding: 16px;
}
.card {
  background: white;
  padding: 20px;
  border-radius: 12px;
  max-width: 550px;
  margin: auto;
}
button {
  background: #c8102e;
  color: white;
  border: none;
  padding: 15px;
  border-radius: 8px;
  width: 100%;
  font-size: 16px;
  margin-bottom: 12px;
}
.secondary {
  background: #344054;
}
.warning {
  background: #a15c00;
}
button:disabled {
  background: #b5b5b5;
}
pre {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font-size: 13px;
}
.aviso {
  background: #fff3cd;
  padding: 12px;
  border-radius: 8px;
  font-size: 14px;
}
</style>
</head>

<body>

<div class="card">

<h2>Recuperación de rondas V3</h2>

<p class="aviso">
Intervención controlada.
Los registros históricos se conservarán
en un respaldo local independiente.
</p>

<button onclick="diagnosticar()">
  1. Revisar registros
</button>

<button class="secondary" onclick="descargarRespaldo()">
  2. Descargar respaldo completo
</button>

<button id="btnAislar" class="warning"
        onclick="aislarRegistros()" disabled>
  3. Aislar registros históricos
</button>

<pre id="resultado"></pre>

</div>

<script>

const QUEUE_KEY = 'rv_offline_queue_v1';
const MAP_KEY = 'rv_id_map_v1';
const BACKUP_KEY = 'rv_recovery_backup_20261125_v3';

let diagnostico = null;
let descargaSolicitada = false;

function obtenerDatos() {

  const raw = {};

  raw[QUEUE_KEY] = localStorage.getItem(QUEUE_KEY);
  raw[MAP_KEY] = localStorage.getItem(MAP_KEY);

  const activas = {};

  Object.keys(localStorage)
    .filter(k => k.startsWith('rv_active_'))
    .sort()
    .forEach(k => {
      raw[k] = localStorage.getItem(k);
      activas[k] = JSON.parse(raw[k]);
    });

  return {
    version: 'recuperacion-v3',
    exportedAt: new Date().toISOString(),
    pending: JSON.parse(raw[QUEUE_KEY] || '[]'),
    idMap: JSON.parse(raw[MAP_KEY] || '{}'),
    activeRounds: activas,
    rawStorage: raw
  };

}

function validar(datos) {

  return (
    Array.isArray(datos.pending) &&
    datos.pending.length === 96 &&
    Object.keys(datos.activeRounds).length === 2 &&
    Object.keys(datos.idMap).length === 34 &&
    datos.pending[0]?.action === 'start' &&
    datos.pending[0]?.payload?.id === 'R-1793973767454' &&
    Object.values(datos.activeRounds)
      .some(r => r?.id === 'RV-20261019-001') &&
    Object.values(datos.activeRounds)
      .some(r => r?.id === 'RV-20261030-001')
  );

}

function diagnosticar() {

  const salida = document.getElementById('resultado');

  try {

    diagnostico = obtenerDatos();
    descargaSolicitada = false;

    document.getElementById('btnAislar').disabled = true;

    const valido = validar(diagnostico);

    salida.textContent = [
      'DIAGNÓSTICO V3',
      '',
      'Registros pendientes: ' + diagnostico.pending.length,
      'Rondas activas: ' +
        Object.keys(diagnostico.activeRounds).length,
      'Identificadores vinculados: ' +
        Object.keys(diagnostico.idMap).length,
      '',
      valido
        ? 'Datos esperados identificados.'
        : 'Datos diferentes. NO INTERVENIR.',
      '',
      'Respaldo histórico existente: ' +
        (localStorage.getItem(BACKUP_KEY) ? 'SI' : 'NO'),
      '',
      'No se modificaron registros.'
    ].join('\n');

  } catch (error) {

    salida.textContent = 'Error: ' + error.message;

  }

}

function descargarRespaldo() {

  try {

    const datos = obtenerDatos();

    if (!diagnostico || !validar(datos)) {
      alert('Realiza primero el diagnóstico.');
      return;
    }

    if (
      JSON.stringify(datos.rawStorage) !==
      JSON.stringify(diagnostico.rawStorage)
    ) {
      alert('Los datos cambiaron. Detener intervención.');
      return;
    }

    const blob = new Blob(
      [JSON.stringify(datos, null, 2)],
      {type: 'application/json'}
    );

    const url = URL.createObjectURL(blob);
    const enlace = document.createElement('a');

    enlace.href = url;
    enlace.download = 'respaldo_rondas_v3_' +
      new Date().toISOString().replace(/[:.]/g, '-') +
      '.json';

    document.body.appendChild(enlace);
    enlace.click();
    enlace.remove();

    setTimeout(() => URL.revokeObjectURL(url), 1000);

    descargaSolicitada = true;

    document.getElementById('btnAislar').disabled = false;

    alert(
      'Descarga solicitada. Verifica el archivo antes de aislar.'
    );

  } catch (error) {

    alert('Error de respaldo: ' + error.message);

  }

}

function aislarRegistros() {

  const salida = document.getElementById('resultado');

  let datos;
  let modificacionIniciada = false;

  try {

    if (!diagnostico || !descargaSolicitada) {
      throw new Error('Falta diagnóstico o respaldo.');
    }

    if (navigator.onLine) {
      throw new Error('Activa el modo avión antes de continuar.');
    }

    datos = obtenerDatos();

    if (!validar(datos)) {
      throw new Error('Los registros no coinciden.');
    }

    if (
      JSON.stringify(datos.rawStorage) !==
      JSON.stringify(diagnostico.rawStorage)
    ) {
      throw new Error('Los datos cambiaron.');
    }

    if (localStorage.getItem(BACKUP_KEY) !== null) {
      throw new Error('Ya existe un respaldo histórico.');
    }

    const confirmacion = prompt(
      'Confirma que el respaldo externo fue verificado. ' +
      'Para aislar los registros escribe AISLAR 96'
    );

    if (confirmacion !== 'AISLAR 96') {
      return;
    }

    const contenido = JSON.stringify(datos);

    localStorage.setItem(BACKUP_KEY, contenido);

    if (localStorage.getItem(BACKUP_KEY) !== contenido) {
      throw new Error('No se pudo verificar el respaldo local.');
    }

    modificacionIniciada = true;

    localStorage.setItem(QUEUE_KEY, '[]');

    Object.keys(datos.activeRounds).forEach(k => {
      localStorage.removeItem(k);
    });

    const verificacion = obtenerDatos();

    if (
      verificacion.pending.length !== 0 ||
      Object.keys(verificacion.activeRounds).length !== 0 ||
      localStorage.getItem(MAP_KEY) !== datos.rawStorage[MAP_KEY]
    ) {
      throw new Error('La verificación final no coincide.');
    }

    document.getElementById('btnAislar').disabled = true;

    salida.textContent = [
      'AISLAMIENTO COMPLETADO',
      '',
      'Registros históricos respaldados: 96',
      'Rondas históricas respaldadas: 2',
      'Identificadores conservados: 34',
      '',
      'Cola activa: 0',
      'Rondas activas locales: 0',
      '',
      'Respaldo histórico local: VERIFICADO',
      '',
      'Google Sheets: SIN MODIFICACIONES',
      '',
      'No abrir todavía la aplicación principal.'
    ].join('\n');

  } catch (error) {

    let restaurado = false;

    if (modificacionIniciada && datos) {

      try {

        Object.entries(datos.rawStorage).forEach(([k, v]) => {
          if (v === null) {
            localStorage.removeItem(k);
          } else {
            localStorage.setItem(k, v);
          }
        });

        restaurado = Object.entries(datos.rawStorage)
          .every(([k, v]) => localStorage.getItem(k) === v);

      } catch (restoreError) {

        restaurado = false;

      }

    }

    salida.textContent = [
      'INTERVENCIÓN DETENIDA',
      error.message,
      modificacionIniciada
        ? (restaurado
            ? 'Datos originales restaurados.'
            : 'Restauración no verificada. No abrir la app.')
        : 'No se modificó la cola activa.'
    ].join('\n');

  }

}

</script>
</body>
</html>
