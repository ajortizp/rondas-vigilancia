
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recuperación de rondas</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f5f7;
  padding: 20px;
}
.card {
  background: white;
  padding: 20px;
  border-radius: 12px;
  max-width: 500px;
  margin: auto;
}
button {
  background: #c8102e;
  color: white;
  border: none;
  padding: 15px;
  border-radius: 8px;
  width: 100%;
  font-size: 16px;
}
pre {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
</style>
</head>
<body>
<div class="card">
  <h2>Recuperación de rondas</h2>
  <p>Diagnóstico del almacenamiento local.</p>
  <button onclick="diagnosticar()">
    Revisar registros
  </button>
  <pre id="resultado"></pre>
</div>

<script>
function diagnosticar() {
  const salida = document.getElementById('resultado');

  try {
    const pendientes = JSON.parse(
      localStorage.getItem('rv_offline_queue_v1') || '[]'
    );

    const mapa = JSON.parse(
      localStorage.getItem('rv_id_map_v1') || '{}'
    );

    const activas = Object.keys(localStorage)
      .filter(k => k.startsWith('rv_active_'));

    salida.textContent = [
      'Registros pendientes: ' + pendientes.length,
      'Rondas activas locales: ' + activas.length,
      'Identificadores vinculados: ' + Object.keys(mapa).length,
      '',
      pendientes.length === 96
        ? 'Cola de 96 registros identificada.'
        : 'Cantidad distinta de la esperada.',
      '',
      'Diagnóstico completado.',
      'No se ha modificado ningún registro.'
    ].join('\n');

  } catch (error) {
    salida.textContent = 'Error: ' + error.message;
  }
}
</script>
</body>
</html>
